name: Atualizar dados do Bacen
on:
  schedule:
    - cron: '17 22 * * *' # 19h17 em Brasília (UTC-3)
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/publish_collection_pr.sh'
      - '.github/workflows/update-data.yml'
      - 'scripts/update_data.py'
      - 'scripts/monitor_update.py'
      - 'scripts/build_bulletin.py'
      - 'observatorio/**'
      - 'catalog.json'
      - 'sql/**'
      - 'tests/**'
      - 'requirements*.txt'
permissions:
  contents: read
concurrency:
  group: bacen-daily
  cancel-in-progress: false
jobs:
  update:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - name: Registrar início da tentativa
        run: python3 scripts/monitor_update.py start
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: 'requirements*.txt'
      - name: Instalar dependências
        id: install
        run: python -m pip install -r requirements-update.txt
      - name: Testar proteção contra publicação incompleta
        id: tests
        run: python -m pytest -q tests
      - name: Coletar e validar todas as séries do catálogo
        id: collect
        run: python scripts/update_data.py
      - name: Registrar resultado operacional
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
          INSTALL_STATUS: ${{ steps.install.outcome }}
          TEST_STATUS: ${{ steps.tests.outcome }}
          COLLECT_STATUS: ${{ steps.collect.outcome }}
        run: |
          status=failed
          stage=preparacao
          if [ "$INSTALL_STATUS" = success ]; then stage=testes; fi
          if [ "$TEST_STATUS" = success ]; then stage=coleta_e_validacao; fi
          if [ "$JOB_STATUS" = success ] && [ "$COLLECT_STATUS" = success ]; then
            status=success
            stage=snapshot_validado
          fi
          if [ "$JOB_STATUS" = cancelled ]; then status=cancelled; fi
          python3 scripts/monitor_update.py finish --status "$status" --stage "$stage"
      - name: Autorizar publicação da coleta
        if: ${{ !cancelled() }}
        id: publisher
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ vars.COLLECTOR_APP_ID }}
          private-key: ${{ secrets.COLLECTOR_APP_PRIVATE_KEY }}
      - name: Publicar dados ou diagnóstico de falha
        if: ${{ !cancelled() && steps.publisher.outcome == 'success' }}
        env:
          GH_TOKEN: ${{ steps.publisher.outputs.token }}
          JOB_STATUS: ${{ job.status }}
          COLLECT_STATUS: ${{ steps.collect.outcome }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if [ "$JOB_STATUS" = success ] && [ "$COLLECT_STATUS" = success ]; then
            git add data/processed
          else
            git add data/processed/monitoring.json
          fi
          bash scripts/publish_collection_pr.sh bacen
      - name: Gerar boletim da coleta publicada
        if: success() && steps.collect.outcome == 'success'
        run: python scripts/build_bulletin.py
      - name: Preservar evidências e diagnóstico
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: coleta-bacen-${{ github.run_id }}
          path: |
            work/bulletin
            data/processed/monitoring.json
            work/collection-*/data/raw
            work/collection-*/reports/runs
            work/collection-*/data/processed/last_attempt.json
          retention-days: 7
          if-no-files-found: ignore
