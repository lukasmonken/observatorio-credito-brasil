name: Atualizar dados do Bacen
on:
  schedule:
    - cron: '17 22 * * *' # 19h17 em Brasília (UTC-3)
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/update-data.yml'
      - 'scripts/update_data.py'
      - 'scripts/monitor_update.py'
      - 'observatorio/**'
      - 'sql/**'
      - 'tests/**'
      - 'requirements*.txt'
permissions:
  contents: write
concurrency:
  group: bacen-daily
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      - name: Registrar início da tentativa
        run: python3 scripts/monitor_update.py start
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: 'requirements*.txt'
      - name: Instalar dependências
        id: install
        run: python -m pip install -r requirements-update.txt
      - name: Testar proteção contra publicação incompleta
        id: tests
        run: python -m pytest -q tests
      - name: Coletar e validar as 24 séries
        id: collect
        run: python scripts/update_data.py
      - name: Registrar resultado operacional
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
          INSTALL_STATUS: ${{ steps.install.outcome }}
          TEST_STATUS: ${{ steps.tests.outcome }}
          COLLECT_STATUS: ${{ steps.collect.outcome }}
        run: |
          status=failed
          stage=preparacao
          if [ "$INSTALL_STATUS" = success ]; then stage=testes; fi
          if [ "$TEST_STATUS" = success ]; then stage=coleta_e_validacao; fi
          if [ "$JOB_STATUS" = success ] && [ "$COLLECT_STATUS" = success ]; then
            status=success
            stage=snapshot_validado
          fi
          if [ "$JOB_STATUS" = cancelled ]; then status=cancelled; fi
          python3 scripts/monitor_update.py finish --status "$status" --stage "$stage"
      - name: Publicar dados ou diagnóstico de falha
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
          COLLECT_STATUS: ${{ steps.collect.outcome }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if [ "$JOB_STATUS" = success ] && [ "$COLLECT_STATUS" = success ]; then
            git add data/processed
          else
            git add data/processed/monitoring.json
          fi
          if ! git diff --cached --quiet; then
            git commit -m 'Atualizar dados e estado operacional do Bacen'
            git push origin HEAD:main
          fi
      - name: Preservar evidências e diagnóstico
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coleta-bacen-${{ github.run_id }}
          path: |
            data/processed/monitoring.json
            work/collection-*/data/raw
            work/collection-*/reports/runs
            work/collection-*/data/processed/last_attempt.json
          retention-days: 7
          if-no-files-found: ignore
