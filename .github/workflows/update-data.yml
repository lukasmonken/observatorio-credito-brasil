name: Atualizar dados do Bacen
on:
  schedule:
    - cron: '17 22 * * *' # 19h17 em Brasília (UTC-3)
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/update-data.yml'
      - 'scripts/update_data.py'
      - 'observatorio/**'
      - 'sql/**'
      - 'tests/**'
      - 'requirements*.txt'
permissions:
  contents: write
concurrency:
  group: bacen-daily
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: 'requirements*.txt'
      - name: Instalar dependências
        run: python -m pip install -r requirements-update.txt
      - name: Testar proteção contra publicação incompleta
        run: python -m pytest -q tests
      - name: Coletar e validar as 24 séries
        run: python scripts/update_data.py
      - name: Publicar snapshot validado
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/processed
          if ! git diff --cached --quiet; then
            git commit -m 'Atualizar snapshot diário do Bacen'
            git push origin HEAD:main
          fi
      - name: Preservar evidências e diagnóstico
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coleta-bacen-${{ github.run_id }}
          path: |
            work/collection-*/data/raw
            work/collection-*/reports/runs
            work/collection-*/data/processed/last_attempt.json
          retention-days: 7
          if-no-files-found: ignore
