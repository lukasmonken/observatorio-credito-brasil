name: Backup dos dados no Google Drive
on:
  workflow_run:
    workflows: ['Atualizar dados do Bacen']
    types: [completed]
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: backup-google-drive
  cancel-in-progress: false
jobs:
  backup:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          persist-credentials: false
      - name: Verificar autorização do Google Drive
        env:
          DRIVE_CONFIG: ${{ secrets.BACKUP_RCLONE_CONFIG }}
        run: |
          if [ -z "$DRIVE_CONFIG" ]; then
            echo '::error::Configure BACKUP_RCLONE_CONFIG conforme docs/backup.md. Nenhum backup externo foi enviado.'
            exit 1
          fi
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
          cache: pip
      - name: Instalar dependências
        run: |
          python -m pip install -r requirements.txt
          sudo apt-get update -qq
          sudo apt-get install -y rclone
      - name: Gerar backup validado
        run: |
          mkdir -p "$RUNNER_TEMP/backup"
          python scripts/backup_data.py --output "$RUNNER_TEMP/backup/credito-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.zip"
          cd "$RUNNER_TEMP/backup"
          sha256sum *.zip > SHA256SUMS
          git -C "$GITHUB_WORKSPACE" rev-parse HEAD > source-commit.txt
      - name: Enviar e verificar cópia externa
        env:
          DRIVE_CONFIG: ${{ secrets.BACKUP_RCLONE_CONFIG }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          config="$RUNNER_TEMP/backup-rclone.conf"
          trap 'rm -f "$config"' EXIT
          printf '%s' "$DRIVE_CONFIG" > "$config"
          unset DRIVE_CONFIG
          destination="backup:Observatorio-Credito-Brasil/${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          rclone copy "$RUNNER_TEMP/backup" "$destination" --config "$config" --immutable --retries 3 --low-level-retries 3 --contimeout 30s --timeout 2m
          rclone check "$RUNNER_TEMP/backup" "$destination" --config "$config" --download --one-way --retries 3 --contimeout 30s --timeout 2m
          echo 'Backup enviado e conferido no Google Drive.' >> "$GITHUB_STEP_SUMMARY"
          mkdir -p "$RUNNER_TEMP/recovery-download"
          rclone copy "$destination" "$RUNNER_TEMP/recovery-download" --config "$config" --retries 3 --low-level-retries 3 --contimeout 30s --timeout 2m
          expected=$(cut -d ' ' -f 1 "$RUNNER_TEMP/backup/SHA256SUMS")
          python scripts/restore_backup.py "$RUNNER_TEMP/recovery-download/credito-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.zip" --destination "$RUNNER_TEMP/recovered" --sha256 "$expected" --check-dashboard --report "$RUNNER_TEMP/recovery-report/result.json"
          echo 'Recuperação isolada e carregamento das páginas do dashboard aprovados.' >> "$GITHUB_STEP_SUMMARY"
          python scripts/retain_backups.py --config "$config" --current "${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" --verified-local "$RUNNER_TEMP/backup" --report "$RUNNER_TEMP/retention/report.json" --apply | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Preservar cópia auxiliar por sete dias
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backup-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/backup/
            ${{ runner.temp }}/retention/
            ${{ runner.temp }}/recovery-report/
          retention-days: 7
          if-no-files-found: ignore
