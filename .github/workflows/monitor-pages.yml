name: Monitorar site publicado
on:
  schedule:
    - cron: '23 */6 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/monitor_pages.py
      - web/live/**
      - web/playwright.live.config.mjs
      - .github/workflows/monitor-pages.yml
  workflow_run:
    workflows: ['Publicar dashboard no GitHub Pages']
    types: [completed]
    branches: [main]
permissions:
  contents: read
concurrency:
  group: pages-monitor
  cancel-in-progress: false
jobs:
  monitor:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.event != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
      - run: python -m pip install requests==2.34.2
      - name: Verificar disponibilidade, integridade e coleta publicada
        id: http
        run: python scripts/monitor_pages.py
      - uses: actions/setup-node@v7
        if: success() || steps.http.outcome == 'failure'
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Instalar teste de navegador
        if: success() || steps.http.outcome == 'failure'
        working-directory: web
        run: |
          npm ci --ignore-scripts
          npx playwright install --with-deps chromium
      - name: Conferir renderização no endereço público
        if: success() || steps.http.outcome == 'failure'
        working-directory: web
        run: npx playwright test --config playwright.live.config.mjs
      - name: Guardar diagnóstico
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pages-monitor-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            work/pages-monitor.json
            web/test-results/live/
          retention-days: 7
