name: Monitorar site publicado
on:
  schedule:
    - cron: '23 */6 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - requirements-http.txt
      - scripts/monitor_pages.py
      - web/live/**
      - web/playwright.live.config.mjs
      - .github/workflows/monitor-pages.yml
  workflow_run:
    workflows: ['Publicar dashboard no GitHub Pages']
    types: [completed]
    branches: [main]
permissions:
  contents: read
concurrency:
  group: pages-monitor
  cancel-in-progress: false
jobs:
  monitor:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.event != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.14'
      - run: >-
          python -m pip install --only-binary=:all: --require-hashes -r requirements-http.txt
      - name: Verificar disponibilidade, integridade e coleta publicada
        id: http
        run: python scripts/monitor_pages.py
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        if: success() || steps.http.outcome == 'failure'
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Instalar teste de navegador
        if: success() || steps.http.outcome == 'failure'
        working-directory: web
        run: |
          npm ci --ignore-scripts
          npx playwright install --with-deps chromium
      - name: Conferir renderização no endereço público
        if: success() || steps.http.outcome == 'failure'
        working-directory: web
        run: npx playwright test --config playwright.live.config.mjs
      - name: Guardar diagnóstico
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pages-monitor-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            work/pages-monitor.json
            web/test-results/live/
          retention-days: 7
