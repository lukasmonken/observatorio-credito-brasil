name: Confirmar autenticação do coletor
on:
  push:
    branches: [codex/coletas-via-pr]
    paths: ['.github/workflows/confirmar-app.yml']
permissions: {}
jobs:
  autenticar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.COLLECTOR_APP_ID }}
          private-key: ${{ secrets.COLLECTOR_APP_PRIVATE_KEY }}
