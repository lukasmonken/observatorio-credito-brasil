name: Atualizar inflação do IBGE
on:
  workflow_dispatch:
  schedule:
    - cron: '43 22 * * *'
  push:
    branches: [main]
    paths:
      - requirements-http.txt
      - 'scripts/publish_collection_pr.sh'
      - 'observatorio/inflation_detail.py'
      - 'scripts/update_inflation.py'
      - '.github/workflows/update-inflation.yml'
permissions:
  contents: read
concurrency:
  group: inflation-${{ github.ref }}
  cancel-in-progress: false
jobs:
  collect:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.14'
      - run: >-
          python -m pip install --only-binary=:all: --require-hashes -r requirements-http.txt
      - name: Coletar e validar as três tabelas
        run: python scripts/update_inflation.py
      - name: Autorizar publicação da coleta
        if: ${{ !cancelled() }}
        id: publisher
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ vars.COLLECTOR_APP_ID }}
          private-key: ${{ secrets.COLLECTOR_APP_PRIVATE_KEY }}
      - name: Publicar coleta completa
        env:
          GH_TOKEN: ${{ steps.publisher.outputs.token }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/inflation
          bash scripts/publish_collection_pr.sh ibge
