name: Atualizar inflação do IBGE
on:
  workflow_dispatch:
  schedule:
    - cron: '43 22 * * *'
  push:
    branches: [main]
    paths:
      - 'observatorio/inflation_detail.py'
      - 'scripts/update_inflation.py'
      - '.github/workflows/update-inflation.yml'
permissions:
  contents: write
concurrency:
  group: inflation-${{ github.ref }}
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
      - run: python -m pip install requests==2.34.2
      - name: Coletar e validar as três tabelas
        run: python scripts/update_inflation.py
      - name: Publicar coleta completa
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/inflation
          if ! git diff --cached --quiet; then
            git commit -m 'Atualiza detalhamento oficial da inflação IBGE'
            git push
          fi
