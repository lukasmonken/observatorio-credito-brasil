name: Homologar fontes de inflacao
on:
  push:
    branches: [codex/inflacao-ampliada]
    paths: [.github/workflows/probe-inflation.yml]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Validar acesso oficial
        run: |
          for host in 'https://apisidra.ibge.gov.br/values/t/7060/n1/1/v/63/p/last%201/c315/7169' 'https://servicodados.ibge.gov.br/api/v3/agregados/7060/periodos/202609/variaveis/63?localidades=N1%5Ball%5D&classificacao=315%5B7169%5D'; do
            curl -4 --connect-timeout 10 --max-time 30 -sS "$host" || true
          done
