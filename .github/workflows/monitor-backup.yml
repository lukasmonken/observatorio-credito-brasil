name: Monitorar backups no Google Drive
on:
  schedule:
    - cron: '23 1,7,13,19 * * *'
  workflow_dispatch:
  workflow_run:
    workflows: ['Backup dos dados no Google Drive']
    types: [completed]
    branches: [main]
permissions:
  contents: read
  actions: read
concurrency:
  group: backup-monitor
  cancel-in-progress: false
jobs:
  monitor:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          persist-credentials: false
      - name: Verificar falhas e ausência de backup
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 scripts/monitor_backup.py --report "$RUNNER_TEMP/backup-monitor/status.json"
      - name: Preservar diagnóstico
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backup-monitor-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/backup-monitor/
          retention-days: 30
          if-no-files-found: ignore
