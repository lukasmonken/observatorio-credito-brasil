name: Verificar aplicação
on:
  pull_request:
  push:
    paths:
      - 'observatorio/**'
      - 'dashboard/**'
      - 'scripts/**'
      - 'tests/**'
      - 'sql/**'
      - 'requirements*.txt'
      - 'pyproject.toml'
      - '.github/workflows/ci.yml'
      - '.github/workflows/monitor-data.yml'
      - '.github/workflows/monitor-backup.yml'
      - '.github/workflows/monitor-pages.yml'
      - '.github/workflows/update-data.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: observatorio
          POSTGRES_PASSWORD: test-only
          POSTGRES_DB: observatorio_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U observatorio -d observatorio_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql+psycopg://observatorio:test-only@localhost:5432/observatorio_test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: 'requirements*.txt'
      - name: Verificar hashes das dependências HTTP
        run: >-
          python -m pip download --only-binary=:all: --require-hashes -r requirements-http.txt -d "$RUNNER_TEMP/http-wheels"
      - name: Instalar dependências
        run: python -m pip install -r requirements-update.txt -r requirements-dev.txt
      - name: Análise estática
        run: |
          ruff check observatorio dashboard scripts tests
          mypy observatorio scripts/update_data.py scripts/monitor_update.py scripts/monitor_backup.py scripts/monitor_pages.py
      - name: Testes e cobertura
        run: |
          python -m coverage run -m pytest -q
          python -m coverage report
      - name: Homologar coleta sem publicar
        if: github.event_name == 'push' && github.ref != 'refs/heads/main'
        run: python scripts/update_data.py
      - name: Preservar diagnóstico da homologação
        if: always() && github.event_name == 'push' && github.ref != 'refs/heads/main'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: homologacao-${{ github.run_id }}
          path: |
            work/collection-*/data/raw
            work/collection-*/reports/runs
            work/collection-*/data/processed/last_attempt.json
          retention-days: 7
          if-no-files-found: ignore
