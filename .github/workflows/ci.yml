name: Verificar aplicação
on:
  pull_request:
  push:
    paths:
      - 'observatorio/**'
      - 'dashboard/**'
      - 'scripts/**'
      - 'tests/**'
      - 'sql/**'
      - 'requirements*.txt'
      - 'pyproject.toml'
      - '.github/workflows/ci.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: observatorio
          POSTGRES_PASSWORD: test-only
          POSTGRES_DB: observatorio_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U observatorio -d observatorio_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql+psycopg://observatorio:test-only@localhost:5432/observatorio_test
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: 'requirements*.txt'
      - name: Instalar dependências
        run: python -m pip install -r requirements-update.txt -r requirements-dev.txt
      - name: Análise estática
        run: |
          ruff check observatorio dashboard scripts tests
          mypy observatorio scripts/update_data.py
      - name: Testes e cobertura
        run: |
          python -m coverage run -m pytest -q
          python -m coverage report
      - name: Homologar coleta sem publicar
        if: github.event_name == 'push' && github.ref != 'refs/heads/main'
        run: python scripts/update_data.py
      - name: Preservar diagnóstico da homologação
        if: always() && github.event_name == 'push' && github.ref != 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: homologacao-${{ github.run_id }}
          path: |
            work/collection-*/data/raw
            work/collection-*/reports/runs
            work/collection-*/data/processed/last_attempt.json
          retention-days: 7
          if-no-files-found: ignore
