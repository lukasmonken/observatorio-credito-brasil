name: Publicar dashboard no GitHub Pages
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'web/**'
      - 'observatorio/export_columns.json'
      - 'scripts/build_pages_data.py'
      - 'tests/test_pages_data.py'
      - 'docs/metodologia.md'
      - '.github/workflows/pages.yml'
  pull_request:
  workflow_run:
    workflows: ['Atualizar dados do Bacen', 'Atualizar inflação do IBGE', 'Atualizar desocupação regional do IBGE']
    types: [completed]
    branches: [main]
permissions:
  contents: read
concurrency:
  group: pages-${{ github.event_name == 'pull_request' && github.ref || 'production' }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event_name == 'workflow_run' && 'main' || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: 'requirements*.txt'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: python -m pip install -r requirements-update.txt
      - run: npm ci --ignore-scripts
        working-directory: web
      - name: Validar snapshot e preparar dados públicos
        run: |
          python -m pytest -q tests/test_pages_data.py
          python scripts/build_pages_data.py
          python web/tests/parity.py
      - name: Testar equivalência com Python e gerar site
        working-directory: web
        run: |
          npm test
          npm run build
      - name: Instalar navegador de testes
        working-directory: web
        run: npx playwright install --with-deps chromium
      - name: Testar páginas, filtros, exportações e responsividade
        working-directory: web
        run: npm run test:browser
      - name: Guardar diagnóstico visual
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pages-qa-${{ github.run_id }}
          path: web/test-results/
          retention-days: 7
      - uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: web/dist
  deploy:
    if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || github.event_name == 'workflow_run')
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
        id: deployment
