<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="data:," />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta
      name="description"
      content="Indicadores oficiais de crédito e conjuntura do Brasil. Séries do Bacen, histórico de revisões e análise econômica."
    />
    <script>try { document.documentElement.dataset.theme = localStorage.getItem("observatorio-theme") === "dark" ? "dark" : "light"; } catch { document.documentElement.dataset.theme = "light"; }</script>
    <title>Observatório Econômico do Brasil</title>
    <link rel="stylesheet" href="{{CSS}}" />
    <script type="module" src="{{JS}}"></script>
  </head>
  <body>
    <button id="theme-toggle" type="button" aria-label="Ativar modo escuro" title="Ativar modo escuro" aria-pressed="false"></button>
    <a class="skip" href="#content">Ir para os dados</a>
    <aside>
      <a class="brand" href="#panorama">OBSERVATÓRIO / BRASIL</a>
      <nav aria-label="Navegação principal" id="nav"></nav>
      <div id="sidebar-meta"></div>
      <a
        class="secondary"
        href="https://observatorio-credito-brasil.streamlit.app/"
        target="_blank"
        rel="noopener"
        >Versão Streamlit</a
      >
    </aside>
    <div class="workspace">
      <header>
        <h1>Observatório Econômico do Brasil</h1>
        <p>Dados oficiais para acompanhar a economia brasileira</p>
        <div id="metadata" class="muted"></div>
      </header>
      <div id="health" role="status"></div>
      <main id="content" tabindex="-1" aria-live="polite">
        <p>Carregando a base validada…</p>
      </main>
      <footer>
        Fontes oficiais · BCB / SGS · Análise descritiva, sem inferência causal.
      </footer>
    </div>
    <noscript
      >Ative o JavaScript para utilizar os filtros e gráficos. A versão
      Streamlit permanece disponível no link acima.</noscript
    >
  </body>
</html>
